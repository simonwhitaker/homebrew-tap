# Rewrites deprecated `postflight` blocks pushed by GoReleaser into
# `postflight_steps`. Remove once all casks are released with GoReleaser
# >= v2.19. See goreleaser/goreleaser#6870.
name: Convert postflight

on:
  push:
    branches: [main]
    paths: ["Casks/**"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: convert-postflight
  cancel-in-progress: false

jobs:
  convert:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Convert casks
        run: ruby scripts/convert-postflight.rb

      - name: Commit and push
        run: |
          if git diff --quiet; then
            echo "Nothing to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "Convert postflight to postflight_steps"
          for attempt in 1 2 3; do
            git push && exit 0
            git pull --rebase
          done
          exit 1
